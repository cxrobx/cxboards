[project]
name = "cxboards"
version = "0.1.0"
description = "CXBoards: a local visual planning board (Milanote-shaped) that Chris and his agents share. FastAPI + SQLite server, React Flow UI, a stdio MCP over the same HTTP API, and static snapshots for Onyx."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
    "mcp[cli]>=1.0,<2",
    "markdown>=3.6,<4",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9",
]

[project.scripts]
cxboards = "cxboards.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cxboards = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
