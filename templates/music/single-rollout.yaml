name: Single rollout plan
use_when: Releasing one song — the story you tell about it, the assets, the pitch and a week-by-week calendar from four weeks out to two weeks after.
cards:
  - note: |
      # *Song* — out *date*
      **The one-line story:** why this song, why now.
      **Who it's for:** the listener you picture hearing it first.
    color: amber
    width: 340
  - todo: Assets
    items:
      - Master (and clean / instrumental versions)
      - Cover art (3000 × 3000)
      - Lyrics and credits
      - Canvas / short loop
      - Press photo
  - break
  - column: 4–3 weeks out
    cards:
      - todo: ""
        items: [Upload to distributor, Pitch to editorial playlists, Pre-save link live, Plan the content]
  - column: 2–1 weeks out
    cards:
      - todo: ""
        items: [Teasers (three angles on the hook), Tell the people who already listen, Line up the release-day posts]
  - column: Release week
    cards:
      - todo: ""
        items: [Release-day post, Stories and replies, Thank everyone who shared]
  - column: 2 weeks after
    cards:
      - note: What did the numbers say? Saves, streams per listener, where they came from.
      - note: What would you do differently for the next one?
  - break
  - column: Pitch
    cards:
      - note: The 500-character pitch — genre, mood, the story, the comparable artists.
      - note: Curators, blogs and people to send it to.
  - column: Content ideas
    cards:
      - note: The making-of moment worth showing.
      - note: The lyric people will quote.
      - note: A visual that's only this song.
