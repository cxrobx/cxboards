name: Mix revision notes
use_when: Going back and forth on a mix or master — notes on each MM pass, by section and time stamp, until the full listen says it's done.
cards:
  - note: |
      # *Song* — mix notes
      **Mixing / mastering:** you, or *engineer*
      **Reference to match:**
      **The keeper:** the newest MM export by date — MMX can still be a pass in progress.
    color: amber
    width: 360
  - todo: Listen on
    items: [Studio monitors, Headphones, Phone speaker, Car, Earbuds at low volume]
  - note: |
      **Loudness**
      Integrated LUFS · true peak — note it in the file name of the master, as you did on Catharsis.
  - break
  - column: Rough mix
    cards:
      - note: Drop the bounce. What it needs most, in one line.
  - column: MM1
    cards:
      - note: Drop the export.
      - note: "0:00 — note"
  - column: MM2
    cards:
      - note: Drop the export.
      - note: "What changed since MM1:"
  - column: Next MM
    cards:
      - note: Add a column per pass. Stop when a full listen feels right — another loop rarely makes it better.
  - column: Master
    cards:
      - todo: Final
        items: [Master approved, Instrumental, Clean version, Stems archived]
