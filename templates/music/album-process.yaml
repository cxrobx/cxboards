name: EP or album
use_when: Running a project from the first seeds to the release — a thesis held loosely, the shelf you pick from, every song's board, the sequence, and the listen that says it's done.
theme: film
cards:
  - note: |
      # *Project title*
      **Thesis, in pencil:** one line. It's allowed to change.
      **Place in The Arc:** the stage this one is (Awakening · Darkness · Healing · Catharsis · Metamorphosis), or outside it.
      **The one constraint:** a rule for this project only (no guitar, one room, one drum kit…).
    color: amber
    width: 380
  - note: |
      **Thesis changed →**
      *date* — from … to … — because …
  - note: "▣ Drop the cover (and its test rounds) here"
  - swatch: "#E8A04F"
    text: amber
  - swatch: "#D57A4C"
    text: terra
  - swatch: "#7FA06A"
    text: forest
  - break
  - board: Seeds & shelf
    cards:
      - note: |
          # Seeds & shelf
          Make far more than you keep. Everything that might belong — old sketches off the shelf and new ones — goes here first. No counts.
        color: amber
      - break
      - column: Seeds
        cards:
          - note: Sketches, demos and ideas in contention. One card each.
      - column: Keeps coming back
        cards:
          - note: The ones you can't stop returning to.
      - column: On the record
        cards:
          - note: Picked. One line on why it belongs to this record's feeling.
      - column: Cut, and why
        cards:
          - note: Cut for the record's feel, not because it's bad. Say why, and move it to the vault for another life.
  - board: Where it comes from
    cards:
      - note: The season of your life this comes out of. Write it plainly; it may become the essay.
      - column: Mood board
        cards:
          - note: "▣ Drop photos, film stills, colours, places"
      - column: Listening diet
        cards:
          - note: What you're listening to while you make this, and why.
  - board: Sound world & collaborators
    cards:
      - column: Palette
        cards:
          - note: Instruments, textures, the room it lives in.
          - note: "Rules: what this project never does."
      - column: Collaborators
        cards:
          - note: Who, what they bring, and the brief you sent them.
          - todo: Paperwork
            items: [Brief sent, Split sheet agreed, Credits confirmed]
  - board: Songs
    folder: true
    cards:
      - note: One Song board each (New board from template ▸ Music ▸ Song), moved in here. Or duplicate the starter below.
      - board: Song starter
        cards:
          - note: |
              # *Title*
              **What it's about:**
              **How each section should feel:**
              **Key moment:**
          - column: Versions
            cards:
              - note: Sketch → demo / unfin → rough mix → MM passes (keeper = newest MM) → master
          - note: "**Hands off to →** the next track"
  - break
  - column: Sequencing (before mixing)
    width: 320
    cards:
      - note: The order, while you still have every option. The feeling between each pair of songs.
      - note: Opener — what it promises. Closer — what it leaves behind.
      - todo: Still to finish
        items: [Every song has a demo, Every song has a final vocal, Every song mixed, Mastered as a set]
  - column: The ending
    cards:
      - note: How it all ties together. What the last song answers.
  - column: Done when
    cards:
      - note: The drive listen — the whole thing, front to back, no skipping. If it doesn't move you, it isn't it yet.
      - note: Good enough beats another polish loop.
  - column: Budget
    width: 340
    cards:
      - note: |
          | Item | Estimate | Actual |
          |---|---|---|
          | Mixing / mastering | | |
          | Features | | |
          | Cover / photos | | |
          | Video / content | | |
          | Distribution | | |
  - board: Release
    cards:
      - note: When it's done, make a board from Music ▸ Release (EP or album) and move it in here.
